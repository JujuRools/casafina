<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casafina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chango&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div data-scroll-container>
      <div data-scroll-section>
        <header class="top-bar" aria-label="Social and booking links">
          <a class="top-bar-link" href="mailto:hello@example.com?subject=Book%20for%20a%20party">Follow us</a>
          <nav class="top-bar-links">
            <a class="top-bar-link" href="mailto:hello@example.com?subject=Book%20for%20a%20party">BOOK FOR A PARTY</a>
            <span class="frame-action-divider" aria-hidden="true"></span>
            <a class="top-bar-link" href="#" data-booking-open>BOOK A TABLE</a>
          </nav>
        </header>
        <main class="site-shell">
          <div class="frame-placement">
            <img class="top-frame" src="frame.svg" alt="" />
            <img class="frame-logo" src="logo.svg" alt="Casa Fina" />
            <div class="logo-lines" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <nav class="frame-actions" aria-label="Reservations and contact">
              <button class="frame-link" type="button" data-booking-open>BOOK A TACLE</button>
              <span class="frame-action-divider" aria-hidden="true"></span>
              <a class="frame-link" href="mailto:hello@example.com">Our Menu</a>
            </nav>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
